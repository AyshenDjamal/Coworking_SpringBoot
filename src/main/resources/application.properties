# Application Basics
spring.application.name=coworking-space-api
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/coworking_space
spring.datasource.username=postgres
spring.datasource.password=Admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Liquibase (keep if you're using it)
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# JWT Security (NEW)
jwt.secret-key=your-256-bit-secret-key-change-this-for-production
jwt.expiration=86400000 # 24 hours in milliseconds