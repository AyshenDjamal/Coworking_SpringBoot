# Database Configuration
databaseChangeLog:
  -
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coworking_space
    username: postgres
    password: Admin
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # Thymeleaf (Template Engine)
  thymeleaf:
    cache: false # Disable cache for development
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# Server Settings
server:
  port: 8080
  servlet:
    context-path: /coworking




